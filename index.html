<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massive Try Out - PNJ Cyber Security</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- BANK SOAL MASSIVE (35 SOAL) ---
        const QUESTION_BANK = [
            // MATEMATIKA DASAR & LANJUT
            { id: 1, cat: "Matematika", q: "Nilai dari log 2 + log 5 adalah...", opts: ["0", "1", "2", "7", "10"], ans: 1, exp: "log 2 + log 5 = log (2x5) = log 10 = 1." },
            { id: 2, cat: "Matematika", q: "Turunan pertama dari f(x) = 3x² - 4x + 5 adalah...", opts: ["6x - 4", "6x + 4", "3x - 4", "6x", "x - 4"], ans: 0, exp: "Turunan ax^n = anx^(n-1). Jadi 3(2x) - 4(1) + 0 = 6x - 4." },
            { id: 3, cat: "Matematika", q: "Jika 2x - 5 = 11, maka nilai x adalah...", opts: ["3", "6", "8", "9", "12"], ans: 2, exp: "2x = 11 + 5 → 2x = 16 → x = 8." },
            { id: 4, cat: "Matematika", q: "Hasil dari ∫ 2x dx adalah...", opts: ["x² + C", "2x² + C", "x + C", "2 + C", "x³ + C"], ans: 0, exp: "Integral x^n dx = (1/(n+1))x^(n+1). Jadi (2/2)x² = x² + C." },
            { id: 5, cat: "Matematika", q: "Matriks A = [[1, 2], [3, 4]]. Determinan A adalah...", opts: ["-2", "2", "-10", "10", "0"], ans: 0, exp: "Det = (1)(4) - (2)(3) = 4 - 6 = -2." },
            { id: 6, cat: "Matematika", q: "Suku ke-10 dari deret aritmatika 2, 5, 8, ... adalah...", opts: ["27", "29", "30", "32", "35"], ans: 1, exp: "Un = a + (n-1)b. U10 = 2 + (9)(3) = 2 + 27 = 29." },
            { id: 7, cat: "Matematika", q: "Nilai dari sin 30° adalah...", opts: ["0", "0.5", "1", "√3/2", "√2/2"], ans: 1, exp: "Sin 30° adalah setengah dari sisi miring, yaitu 0.5 atau 1/2." },
            
            // FISIKA
            { id: 8, cat: "Fisika", q: "Sebuah benda bergerak dengan kecepatan tetap 10 m/s selama 5 detik. Jarak tempuhnya adalah...", opts: ["2 m", "15 m", "50 m", "500 m", "0.5 m"], ans: 2, exp: "s = v × t = 10 × 5 = 50 meter." },
            { id: 9, cat: "Fisika", q: "Hukum Ohm menyatakan hubungan antara...", opts: ["Gaya dan Massa", "Tegangan, Arus, Hambatan", "Usaha dan Waktu", "Massa dan Energi", "Tekanan dan Volume"], ans: 1, exp: "V = I × R (Tegangan = Arus × Hambatan)." },
            { id: 10, cat: "Fisika", q: "Satuan dari Gaya dalam SI adalah...", opts: ["Joule", "Watt", "Newton", "Pascal", "Ampere"], ans: 2, exp: "Satuan gaya adalah Newton (N)." },
            { id: 11, cat: "Fisika", q: "Energi kinetik sebuah benda bergantung pada...", opts: ["Ketinggian", "Massa dan Kecepatan", "Waktu", "Suhu", "Volume"], ans: 1, exp: "Ek = ½ mv². Bergantung pada massa (m) dan kecepatan (v)." },
            { id: 12, cat: "Fisika", q: "Jika sebuah cermin cembung memiliki jari-jari 20 cm, fokusnya adalah...", opts: ["10 cm", "20 cm", "40 cm", "-10 cm", "-20 cm"], ans: 3, exp: "f = R/2. Cermin cembung bernilai negatif. f = -20/2 = -10 cm." },
            { id: 13, cat: "Fisika", q: "Perpindahan panas tanpa perantara zat disebut...", opts: ["Konduksi", "Konveksi", "Radiasi", "Isolasi", "Evaporasi"], ans: 2, exp: "Radiasi adalah perpindahan panas melalui gelombang elektromagnetik (tanpa zat)." },
            
            // TPA & LOGIKA
            { id: 14, cat: "TPA", q: "Semua dokter adalah pintar. Sebagian orang pintar adalah artis. Kesimpulan?", opts: ["Semua dokter adalah artis", "Sebagian dokter adalah artis", "Tidak dapat disimpulkan", "Semua artis adalah dokter", "Sebagian artis bukan dokter"], ans: 2, exp: "Hubungan antara 'dokter' dan 'artis' tidak dapat ditentukan secara pasti dari premis tersebut." },
            { id: 15, cat: "TPA", q: "Deret angka: 2, 4, 8, 16, ...", opts: ["24", "30", "32", "36", "64"], ans: 2, exp: "Pola dikali 2. 16 x 2 = 32." },
            { id: 16, cat: "TPA", q: "Kertas : Pohon = Kain : ...", opts: ["Benang", "Pakaian", "Kapuk", "Pabrik", "Jahit"], ans: 0, exp: "Kertas berasal dari pohon, Kain berasal dari benang/kapas." },
            { id: 17, cat: "TPA", q: "Jika A > B dan B > C, maka...", opts: ["A < C", "A > C", "A = C", "B < C", "Tidak bisa ditentukan"], ans: 1, exp: "Sifat transitif: Jika A lebih besar dari B, dan B lebih besar dari C, maka A pasti lebih besar dari C." },
            { id: 18, cat: "TPA", q: "Lawan kata dari 'Abstrak' adalah...", opts: ["Nyata", "Maya", "Ilusi", "Khayalan", "Impian"], ans: 0, exp: "Abstrak berarti tidak berwujud, lawan katanya adalah Nyata/Konkret." },
            
            // BAHASA INDONESIA
            { id: 19, cat: "B. Indo", q: "Manakah penulisan yang benar sesuai PUEBI?", opts: ["Di rumah", "Dimana", "Disini", "Dipasar", "Kesekolah"], ans: 0, exp: "'Di' sebagai kata depan ditulis terpisah (Di rumah). Imbuhan digabung (Dimakan)." },
            { id: 20, cat: "B. Indo", q: "Sinonim dari kata 'Efisien' adalah...", opts: ["Tepat guna", "Cepat", "Murah", "Hemat waktu", "Sederhana"], ans: 0, exp: "Efisien berarti tepat atau sesuai untuk mengerjakan sesuatu dengan tidak membuang-buang waktu/tenaga (tepat guna)." },
            { id: 21, cat: "B. Indo", q: "Kalimat efektif harus memenuhi syarat, KECUALI...", opts: ["Kesepadanan", "Keparalelan", "Ketegasan", "Bertele-tele", "Kehematan"], ans: 3, exp: "Kalimat efektif tidak boleh bertele-tele (hemat kata)." },
            
            // BAHASA INGGRIS
            { id: 22, cat: "B. Ing", q: "She ___ to the market yesterday.", opts: ["go", "goes", "went", "gone", "going"], ans: 2, exp: "Yesterday menunjukkan Past Tense, jadi menggunakan Verb 2 (went)." },
            { id: 23, cat: "B. Ing", q: "If it rains, I ___ at home.", opts: ["stay", "will stay", "stayed", "would stay", "staying"], ans: 1, exp: "Conditional Sentence Type 1: If + Present, Future (will)." },
            { id: 24, cat: "B. Ing", q: "The book is ___ the table.", opts: ["in", "at", "on", "to", "for"], ans: 2, exp: "Di atas meja menggunakan preposisi 'on'." },
            { id: 25, cat: "B. Ing", q: "My father ___ a car now.", opts: ["wash", "washes", "is washing", "washed", "was washing"], ans: 2, exp: "'Now' menunjukkan Present Continuous Tense (is/am/are + V-ing)." },
            
            // PENGETAHUAN UMUM & SIBER
            { id: 26, cat: "Umum", q: "CPU adalah singkatan dari...", opts: ["Central Processing Unit", "Computer Personal Unit", "Central Power Unit", "Control Processing Unit", "Central Program Utility"], ans: 0, exp: "CPU = Central Processing Unit." },
            { id: 27, cat: "Umum", q: "Sistem bilangan yang hanya terdiri dari 0 dan 1 disebut...", opts: ["Desimal", "Oktal", "Hexadesimal", "Biner", "Romawi"], ans: 3, exp: "Sistem biner (basis 2) hanya menggunakan angka 0 dan 1." },
            { id: 28, cat: "Umum", q: "RAM berfungsi untuk...", opts: ["Menyimpan data permanen", "Memproses grafis", "Menyimpan data sementara saat program berjalan", "Menghubungkan internet", "Mendinginkan prosesor"], ans: 2, exp: "RAM (Random Access Memory) adalah penyimpanan sementara yang volatil." },
            { id: 29, cat: "Umum", q: "Protokol standar untuk transfer file adalah...", opts: ["HTTP", "FTP", "SMTP", "POP3", "SSH"], ans: 1, exp: "FTP (File Transfer Protocol) digunakan khusus untuk transfer file." },
            { id: 30, cat: "Umum", q: "Malware yang mengunci file dan meminta tebusan disebut...", opts: ["Virus", "Worm", "Trojan", "Ransomware", "Spyware"], ans: 3, exp: "Ransomware melakukan enkripsi file korban dan meminta uang tebusan." },
            { id: 31, cat: "Matematika", q: "Luas lingkaran dengan jari-jari 7 cm adalah... (π=22/7)", opts: ["154 cm²", "44 cm²", "144 cm²", "616 cm²", "22 cm²"], ans: 0, exp: "L = πr² = 22/7 × 7 × 7 = 154 cm²." },
            { id: 32, cat: "Fisika", q: "Alat untuk mengukur kuat arus listrik adalah...", opts: ["Voltmeter", "Amperemeter", "Ohmmeter", "Barometer", "Termometer"], ans: 1, exp: "Amperemeter digunakan untuk mengukur kuat arus (I)." },
            { id: 33, cat: "TPA", q: "Mobil : Bensin = Manusia : ...", opts: ["Makanan", "Jalan", "Rumah", "Sepatu", "Uang"], ans: 0, exp: "Mobil butuh bensin untuk bergerak, Manusia butuh makanan untuk energi." },
            { id: 34, cat: "B. Ing", q: "I have lived here ___ 2010.", opts: ["since", "for", "during", "while", "ago"], ans: 0, exp: "'Since' diikuti titik waktu tertentu (2010)." },
            { id: 35, cat: "Umum", q: "IP Address versi 4 terdiri dari berapa bit?", opts: ["32 bit", "64 bit", "128 bit", "16 bit", "8 bit"], ans: 0, exp: "IPv4 menggunakan 32-bit address." }
        ];

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 20, className }) => {
            useEffect(() => lucide.createIcons(), [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('exam'); // Langsung ke exam
            const [answers, setAnswers] = useState({});
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(180 * 60); // 180 Menit
            const [isFinished, setIsFinished] = useState(false);

            // Timer Logic
            useEffect(() => {
                if (!isFinished && timeLeft > 0) {
                    const timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
                    return () => clearInterval(timer);
                } else if (timeLeft === 0) {
                    setIsFinished(true);
                }
            }, [isFinished, timeLeft]);

            const formatTime = (sec) => {
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                return `${h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            };

            const handleAnswer = (qId, optIndex) => {
                setAnswers(prev => ({ ...prev, [qId]: optIndex }));
            };

            const calculateScore = () => {
                let correct = 0;
                QUESTION_BANK.forEach(q => {
                    if (answers[q.id] === q.ans) correct++;
                });
                return Math.round((correct / QUESTION_BANK.length) * 100);
            };

            // --- VIEW: EXAM INTERFACE ---
            if (!isFinished) {
                const currentQ = QUESTION_BANK[currentQIndex];
                
                return (
                    <div className="flex flex-col md:flex-row h-screen bg-slate-50">
                        {/* LEFT: QUESTION AREA */}
                        <div className="flex-1 flex flex-col h-full overflow-hidden">
                            {/* Header Mobile/Desktop */}
                            <div className="bg-white border-b p-4 flex justify-between items-center shadow-sm z-10">
                                <div>
                                    <span className="text-xs font-bold text-blue-600 uppercase tracking-wider block">{currentQ.cat}</span>
                                    <h2 className="font-bold text-slate-800">Soal No. {currentQIndex + 1}</h2>
                                </div>
                                <div className={`font-mono font-bold text-lg px-3 py-1 rounded ${timeLeft < 300 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-slate-100 text-slate-700'}`}>
                                    {formatTime(timeLeft)}
                                </div>
                            </div>

                            {/* Scrollable Content */}
                            <div className="flex-1 overflow-y-auto p-6 md:p-10">
                                <div className="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100 min-h-[400px]">
                                    <p className="text-lg md:text-xl font-medium text-slate-800 leading-relaxed mb-8">
                                        {currentQ.q}
                                    </p>
                                    
                                    <div className="space-y-3">
                                        {currentQ.opts.map((opt, idx) => (
                                            <label 
                                                key={idx} 
                                                className={`flex items-start p-4 rounded-xl border-2 cursor-pointer transition-all group ${answers[currentQ.id] === idx ? 'border-blue-600 bg-blue-50' : 'border-slate-200 hover:border-blue-300 hover:bg-slate-50'}`}
                                            >
                                                <input 
                                                    type="radio" 
                                                    name={`q-${currentQ.id}`} 
                                                    className="mt-1 mr-4 accent-blue-600 w-5 h-5"
                                                    checked={answers[currentQ.id] === idx}
                                                    onChange={() => handleAnswer(currentQ.id, idx)}
                                                />
                                                <span className="text-slate-700 group-hover:text-slate-900">{opt}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Footer Navigation */}
                            <div className="bg-white border-t p-4 flex justify-between items-center">
                                <button 
                                    onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))}
                                    disabled={currentQIndex === 0}
                                    className="px-6 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-100 disabled:opacity-50 flex items-center gap-2"
                                >
                                    <Icon name="chevron-left" /> Sebelumnya
                                </button>
                                <button 
                                    onClick={() => setCurrentQIndex(prev => Math.min(QUESTION_BANK.length - 1, prev + 1))}
                                    disabled={currentQIndex === QUESTION_BANK.length - 1}
                                    className="px-6 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-100 disabled:opacity-50 flex items-center gap-2"
                                >
                                    Selanjutnya <Icon name="chevron-right" />
                                </button>
                            </div>
                        </div>

                        {/* RIGHT: NAVIGATION GRID */}
                        <div className="w-full md:w-80 bg-white border-l border-slate-200 flex flex-col h-1/3 md:h-full">
                            <div className="p-4 border-b bg-slate-50">
                                <h3 className="font-bold text-slate-700 text-sm uppercase">Navigasi Soal</h3>
                                <p className="text-xs text-slate-500 mt-1">Terjawab: {Object.keys(answers).length} / {QUESTION_BANK.length}</p>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4">
                                <div className="grid grid-cols-5 gap-2">
                                    {QUESTION_BANK.map((q, idx) => (
                                        <button
                                            key={q.id}
                                            onClick={() => setCurrentQIndex(idx)}
                                            className={`aspect-square rounded-lg text-sm font-bold transition-all flex items-center justify-center relative
                                                ${currentQIndex === idx ? 'ring-2 ring-offset-2 ring-blue-500 ' : ''}
                                                ${answers[q.id] !== undefined ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}
                                            `}
                                        >
                                            {idx + 1}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="p-4 border-t bg-slate-50">
                                <button 
                                    onClick={() => setIsFinished(true)}
                                    className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-all shadow-lg flex items-center justify-center gap-2"
                                >
                                    <Icon name="check-circle" size={18} /> Selesai & Lihat Nilai
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- VIEW: RESULT ---
            const score = calculateScore();
            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 overflow-y-auto">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-lg p-8 mb-8 text-center border-t-8 border-blue-600">
                            <h1 className="text-3xl font-bold text-slate-800 mb-2">Hasil Try Out</h1>
                            <div className="text-6xl font-black text-blue-600 my-6">{score}</div>
                            <p className="text-slate-500 mb-6">Benar: {Object.keys(answers).filter(id => answers[id] === QUESTION_BANK.find(q=>q.id==id).ans).length} | Salah: {QUESTION_BANK.length - Object.keys(answers).filter(id => answers[id] === QUESTION_BANK.find(q=>q.id==id).ans).length}</p>
                            <button onClick={() => window.location.reload()} className="px-8 py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800">
                                Ulangi Ujian
                            </button>
                        </div>

                        <div className="space-y-4">
                            {QUESTION_BANK.map((q, idx) => {
                                const isCorrect = answers[q.id] === q.ans;
                                return (
                                    <div key={q.id} className={`bg-white rounded-xl p-6 border-l-4 shadow-sm ${isCorrect ? 'border-green-500' : 'border-red-500'}`}>
                                        <div className="flex gap-4">
                                            <div className="font-bold text-slate-300 text-lg">#{idx + 1}</div>
                                            <div className="flex-1">
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">{q.cat}</span>
                                                    {isCorrect ? <Icon name="check-circle" className="text-green-500" /> : <Icon name="x-circle" className="text-red-500" />}
                                                </div>
                                                <p className="font-medium text-slate-800 mb-4 text-lg">{q.q}</p>
                                                
                                                <div className="bg-slate-50 p-4 rounded-lg text-sm text-slate-700 mb-2">
                                                    <strong>Jawaban Kamu:</strong> {answers[q.id] !== undefined ? q.opts[answers[q.id]] : "Tidak dijawab"}
                                                </div>
                                                
                                                {!isCorrect && (
                                                    <div className="bg-green-50 p-4 rounded-lg text-sm text-green-800 mb-2 border border-green-100">
                                                        <strong>Kunci Jawaban:</strong> {q.opts[q.ans]}
                                                    </div>
                                                )}

                                                <div className="mt-4 pt-4 border-t border-slate-100">
                                                    <p className="text-sm font-bold text-slate-900 mb-1 flex items-center gap-2">
                                                        <Icon name="lightbulb" size={16} className="text-yellow-500" /> Pembahasan:
                                                    </p>
                                                    <p className="text-sm text-slate-600 leading-relaxed">{q.exp}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
